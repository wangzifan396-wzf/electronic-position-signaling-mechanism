<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDM18 钻具控制系统</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0c1520;
  --card: #152230;
  --card-hover: #1a2d40;
  --border: #1e3246;
  --text: #ccd6e0;
  --text-dim: #6b7d93;
  --text-bright: #e8edf3;
  --cyan: #00c8e8;
  --cyan-dim: #006880;
  --green: #2ed573;
  --green-dim: #1a5c30;
  --red: #ff4757;
  --red-dim: #5c1a22;
  --orange: #ffa502;
  --orange-dim: #5c3a10;
  --yellow: #eccc68;
  --blue: #3b7ddd;
  --radius: 8px;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
}
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.5;
}

/* ── Header ─────────────────────── */
.header {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 10px 24px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 100;
}
.header-left { display: flex; align-items: center; gap: 14px; }
.header-title { font-size: 1.1rem; font-weight: 600; color: var(--text-bright); }
.header-sub { font-size: 0.78rem; color: var(--text-dim); }
.status-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  box-shadow: 0 0 6px currentColor;
}
.status-dot.online { background: var(--green); color: var(--green); }
.status-dot.offline { background: var(--red); color: var(--red); animation: pulse-dot 1.5s infinite; }
@keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.35} }
.header-right { display: flex; align-items: center; gap: 18px; font-size: 0.8rem; color: var(--text-dim); flex-wrap: wrap; }
.header-stat { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.header-stat span { color: var(--text-bright); }

/* ── Main grid ──────────────────── */
.main {
  max-width: 1400px;
  margin: 0 auto;
  padding: 16px 20px;
}

/* ── Dashboard cards ────────────── */
.cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 14px; }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; display: flex; flex-direction: column; gap: 6px;
  transition: border-color 0.2s;
}
.card:hover { border-color: #2a4060; }
.card-label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); }
.card-value { font-size: 1.8rem; font-weight: 700; color: var(--text-bright); }
.card-value.big { font-size: 2.6rem; }
.card-sub { font-size: 0.78rem; color: var(--text-dim); }
.card-badge {
  display: inline-block; padding: 3px 10px; border-radius: 12px;
  font-size: 0.82rem; font-weight: 600;
}
.badge-green  { background: var(--green-dim); color: var(--green); }
.badge-blue   { background: #0d2b4a; color: var(--blue); }
.badge-orange { background: var(--orange-dim); color: var(--orange); }
.badge-yellow { background: #3d3520; color: var(--yellow); }
.badge-red    { background: var(--red-dim); color: var(--red); }
.badge-gray   { background: #1e2733; color: var(--text-dim); }
.card-dist-ok .card-value { color: var(--green); }
.card-dist-mid .card-value { color: var(--cyan); }
.card-dist-far .card-value { color: var(--orange); }

/* ── Chart ──────────────────────── */
.chart-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 14px;
}
.chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
.chart-header h3 { font-size: 0.9rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
.chart-stats { display: flex; gap: 18px; font-size: 0.78rem; color: var(--text-dim); flex-wrap: wrap; }
.chart-stats b { color: var(--text-bright); }
.chart-wrap { position: relative; height: 280px; }
.chart-wrap canvas { width: 100%; height: 100%; }

/* ── Bottom panels ──────────────── */
.bottom { display: grid; grid-template-columns: 340px 1fr; gap: 14px; margin-bottom: 14px; }

/* Parameters panel */
.params-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px;
}
.params-panel h3 {
  font-size: 0.85rem; font-weight: 600; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 12px;
}
.param-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.param-label { width: 68px; font-size: 0.8rem; color: var(--text-dim); flex-shrink: 0; }
.param-input {
  flex: 1; width: 60px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-bright); padding: 6px 10px; font-size: 0.85rem;
  font-family: 'Consolas', 'Courier New', monospace; outline: none;
  transition: border-color 0.2s;
}
.param-input:focus { border-color: var(--cyan); }
.param-unit { font-size: 0.75rem; color: var(--text-dim); width: 28px; }
.param-btn {
  padding: 6px 12px; font-size: 0.78rem; border: 1px solid var(--border); border-radius: 4px;
  background: var(--bg); color: var(--cyan); cursor: pointer;
  font-family: inherit; transition: all 0.15s;
}
.param-btn:hover { background: #0d2b3a; border-color: var(--cyan); }
.param-btn:active { transform: scale(0.96); }
.param-btn.confirmed { background: var(--green-dim); border-color: var(--green); color: var(--green); }
.param-btn.error { background: var(--red-dim); border-color: var(--red); color: var(--red); }
.param-action-row { margin-top: 14px; }
.btn-refresh {
  width: 100%; padding: 9px; font-size: 0.82rem; border: 1px solid var(--border);
  border-radius: 4px; background: var(--bg); color: var(--text);
  cursor: pointer; font-family: inherit; transition: all 0.15s;
}
.btn-refresh:hover { border-color: var(--cyan); color: var(--cyan); }

/* Controls panel */
.controls-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px;
}
.controls-panel h3 {
  font-size: 0.85rem; font-weight: 600; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 12px;
}
.ctrl-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.ctrl-btn {
  flex: 1; min-width: 90px; padding: 14px 10px; font-size: 0.9rem; font-weight: 700;
  border: 2px solid var(--border); border-radius: 8px; cursor: pointer;
  font-family: inherit; transition: all 0.15s; text-transform: uppercase;
  letter-spacing: 0.03em;
}
.ctrl-btn:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
.ctrl-down  { background: #0d2b4a; color: var(--blue); }
.ctrl-down:hover:not(:disabled)  { background: #144070; border-color: var(--blue); }
.ctrl-up    { background: var(--orange-dim); color: var(--orange); }
.ctrl-up:hover:not(:disabled)    { background: #6e4818; border-color: var(--orange); }
.ctrl-stop  { background: var(--red-dim); color: var(--red); }
.ctrl-stop:hover:not(:disabled)  { background: #7a1f28; border-color: var(--red); }
.ctrl-reset { background: #1e3326; color: var(--green); }
.ctrl-reset:hover:not(:disabled) { background: #1f4a2e; border-color: var(--green); }
.ctrl-btn:active:not(:disabled) { transform: scale(0.95); }
.confirm-hint { font-size: 0.75rem; color: var(--text-dim); }

/* ── Event log ──────────────────── */
.log-panel {
  background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column;
}
.log-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
.log-header h3 {
  font-size: 0.85rem; font-weight: 600; color: var(--text-dim);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.log-actions { display: flex; gap: 8px; }
.log-actions button {
  padding: 4px 10px; font-size: 0.72rem; border: 1px solid var(--border); border-radius: 4px;
  background: transparent; color: var(--text-dim); cursor: pointer; font-family: inherit;
  transition: all 0.15s;
}
.log-actions button:hover { border-color: var(--cyan); color: var(--cyan); }
.log-actions button.active { background: var(--cyan-dim); border-color: var(--cyan); color: var(--cyan); }
.log-list {
  flex: 1; min-height: 200px; max-height: 320px; overflow-y: auto;
  font-family: 'Consolas', 'Courier New', monospace; font-size: 0.78rem;
  line-height: 1.6; background: var(--bg); border-radius: 4px;
  padding: 8px 10px;
}
.log-list::-webkit-scrollbar { width: 6px; }
.log-list::-webkit-scrollbar-track { background: transparent; }
.log-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.log-entry { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.log-time { color: var(--text-dim); margin-right: 8px; }
.log-cmd { color: #6b8db5; font-style: italic; }
.log-ok { color: var(--green); }
.log-err { color: var(--red); }
.log-alert { color: var(--orange); font-weight: 600; }
.log-status { color: var(--cyan); }
.log-data { color: #7a8fa0; }
.log-empty { color: var(--text-dim); font-style: italic; }

/* ── Responsive ─────────────────── */
@media (max-width: 1100px) {
  .cards { grid-template-columns: repeat(3, 1fr); }
  .bottom { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  .cards { grid-template-columns: repeat(2, 1fr); }
  .header { flex-direction: column; align-items: flex-start; }
}
</style>
</head>
<body>

<!-- ── Header ────────────────────── -->
<div class="header">
  <div class="header-left">
    <div class="status-dot offline" id="statusDot"></div>
    <div>
      <div class="header-title">SDM18 钻具控制系统</div>
      <div class="header-sub" id="headerStatus">等待 STM32 连接...</div>
    </div>
  </div>
  <div class="header-right">
    <div class="header-stat">本机IP: <span id="localIP" style="color:var(--cyan)">--</span></div>
    <div class="header-stat">TCP端口: <span id="tcpPort" style="color:var(--cyan)">8080</span></div>
    <div class="header-stat">运行时间: <span id="uptime">00:00</span></div>
    <div class="header-stat">累计点数: <span id="totalPoints">0</span></div>
  </div>
</div>

<div class="main">

<!-- ── Dashboard cards ───────────── -->
<div class="cards">
  <div class="card" id="cardDist">
    <div class="card-label">距离</div>
    <div class="card-value big" id="valDist">--</div>
    <div class="card-sub">mm</div>
  </div>
  <div class="card">
    <div class="card-label">模式</div>
    <div class="card-value" id="valMode" style="font-size:1.4rem">--</div>
    <div class="card-sub">工作模式</div>
  </div>
  <div class="card">
    <div class="card-label">状态</div>
    <div class="card-value" id="valStatus" style="font-size:1.4rem">--</div>
    <div class="card-sub">运行状态</div>
  </div>
  <div class="card">
    <div class="card-label">到位标记</div>
    <div class="card-value" id="valInPlace">--</div>
    <div class="card-sub">In Place</div>
  </div>
  <div class="card">
    <div class="card-label">反转标记</div>
    <div class="card-value" id="valReversing">--</div>
    <div class="card-sub">Reversing</div>
  </div>
</div>

<!-- ── Distance chart ────────────── -->
<div class="chart-panel">
  <div class="chart-header">
    <h3>距离变化曲线</h3>
    <div class="chart-stats">
      <span>平均: <b id="chartAvg">--</b> mm</span>
      <span>波动: <b id="chartDiff">--</b> mm</span>
      <span>到位阈值: <b id="chartThIn">360</b> mm</span>
      <span>地面阈值: <b id="chartThGnd">700</b> mm</span>
    </div>
  </div>
  <div class="chart-wrap"><canvas id="distChart"></canvas></div>
</div>

<!-- ── Bottom: params + controls ─── -->
<div class="bottom">
  <div class="params-panel">
    <h3>参数设置</h3>
    <div class="param-row">
      <span class="param-label">到位阈值</span>
      <input class="param-input" id="pInPlace" type="number" min="100" max="1000" value="360">
      <span class="param-unit">mm</span>
      <button class="param-btn" onclick="setParam('SET_IN_PLACE', 'pInPlace')">设置</button>
    </div>
    <div class="param-row">
      <span class="param-label">地面阈值</span>
      <input class="param-input" id="pGround" type="number" min="500" max="1500" value="700">
      <span class="param-unit">mm</span>
      <button class="param-btn" onclick="setParam('SET_GROUND', 'pGround')">设置</button>
    </div>
    <div class="param-row">
      <span class="param-label">满芯阈值</span>
      <input class="param-input" id="pFull" type="number" min="20" max="200" value="70">
      <span class="param-unit">mm</span>
      <button class="param-btn" onclick="setParam('SET_FULL', 'pFull')">设置</button>
    </div>
    <div class="param-row">
      <span class="param-label">卡芯阈值</span>
      <input class="param-input" id="pStuck" type="number" min="1" max="50" value="2">
      <span class="param-unit">mm</span>
      <button class="param-btn" onclick="setParam('SET_STUCK', 'pStuck')">设置</button>
    </div>
    <div class="param-row">
      <span class="param-label">电机速度</span>
      <input class="param-input" id="pSpeed" type="number" min="100" max="5000" value="100">
      <span class="param-unit"></span>
      <button class="param-btn" onclick="setParam('SET_SPEED', 'pSpeed')">设置</button>
    </div>
    <div class="param-action-row">
      <button class="btn-refresh" onclick="sendCmd('GET_PARAMS')">刷新参数</button>
    </div>
  </div>

  <div>
    <div class="controls-panel" id="ctrlPanel">
      <h3>手动控制</h3>
      <div class="ctrl-buttons">
        <button class="ctrl-btn ctrl-down" id="btnDown" disabled onclick="sendCmd('CMD_DOWN')">下钻</button>
        <button class="ctrl-btn ctrl-up" id="btnUp" disabled onclick="sendCmd('CMD_UP')">上提</button>
        <button class="ctrl-btn ctrl-stop" id="btnStop" disabled onclick="sendCmd('CMD_STOP')">急停</button>
        <button class="ctrl-btn ctrl-reset" id="btnReset" disabled onclick="sendCmd('CMD_RESET')">复位</button>
      </div>
      <div class="confirm-hint" id="ctrlHint">等待 STM32 连接...</div>
    </div>
  </div>
</div>

<!-- ── Event log ─────────────────── -->
<div class="log-panel">
  <div class="log-header">
    <h3>事件日志</h3>
    <div class="log-actions">
      <button id="btnAutoScroll" class="active" onclick="toggleAutoScroll()">自动滚动</button>
      <button onclick="clearLog()">清空</button>
    </div>
  </div>
  <div class="log-list" id="logList">
    <div class="log-empty">等待数据...</div>
  </div>
</div>

</div><!-- .main -->

<script>
// ═══════════════════════════════════════════
//  SSE connection (auto-reconnecting)
// ═══════════════════════════════════════════
const es = new EventSource('/events');

es.addEventListener('snapshot', (e) => {
  const snap = JSON.parse(e.data);
  handleSnapshot(snap);
});

es.addEventListener('telemetry', (e) => {
  const t = JSON.parse(e.data);
  updateTelemetry(t);
});

es.addEventListener('event', (e) => {
  const entry = JSON.parse(e.data);
  addLogEntry(entry);
});

es.addEventListener('connection', (e) => {
  const c = JSON.parse(e.data);
  updateConnection(c);
});

es.addEventListener('params', (e) => {
  const p = JSON.parse(e.data);
  updateParamInputs(p);
});

es.onopen = () => {
  console.log('SSE connected');
  document.getElementById('statusDot').classList.add('online');
  document.getElementById('statusDot').classList.remove('offline');
};

es.onerror = () => {
  console.log('SSE connection lost (will auto-reconnect)');
  document.getElementById('statusDot').classList.add('offline');
  document.getElementById('statusDot').classList.remove('online');
};

// ═══════════════════════════════════════════
//  Snapshot handler (initial state)
// ═══════════════════════════════════════════
let totalPoints = 0;
let stmConnected = false;

function handleSnapshot(snap) {
  document.getElementById('uptime').textContent = formatTime(snap.uptime || 0);
  document.getElementById('localIP').textContent = snap.serverIP || '--';
  document.getElementById('tcpPort').textContent = snap.tcpPort || '8080';

  stmConnected = snap.stm32Connected;
  updateConnection({ connected: snap.stm32Connected });

  if (snap.currentParams) {
    updateParamInputs(snap.currentParams);
  }

  // Restore chart data
  if (snap.distanceHistory && snap.distanceHistory.length > 0) {
    chartData.labels = snap.distanceHistory.map(p => formatChartTime(p.time));
    chartData.distances = snap.distanceHistory.map(p => p.dist);
    chartData.avgs = snap.distanceHistory.map(p => p.avg || null);
    totalPoints = snap.distanceHistory.length;
    document.getElementById('totalPoints').textContent = totalPoints;
    updateChart();
  }

  // Restore event log
  if (snap.eventLog && snap.eventLog.length > 0) {
    const logList = document.getElementById('logList');
    logList.innerHTML = '';
    for (const entry of snap.eventLog) {
      addLogEntry(entry);
    }
  }

  // Restore latest telemetry
  if (snap.latestTelemetry) {
    updateTelemetryDisplay(snap.latestTelemetry);
  }

  updateChartRefLines();
}

// ═══════════════════════════════════════════
//  Telemetry handling
// ═══════════════════════════════════════════
function updateTelemetry(t) {
  updateTelemetryDisplay(t);
  totalPoints++;
  document.getElementById('totalPoints').textContent = totalPoints;

  // Chart
  const pt = t._point || { time: Date.now() };
  chartData.labels.push(formatChartTime(pt.time));
  chartData.distances.push(t.dist);
  chartData.avgs.push(t.avg || null);

  while (chartData.distances.length > 600) {
    chartData.labels.shift();
    chartData.distances.shift();
    chartData.avgs.shift();
  }

  document.getElementById('chartAvg').textContent = (t.avg != null) ? t.avg : '--';
  document.getElementById('chartDiff').textContent = (t.diff != null) ? t.diff : '--';
  updateChart();
}

function updateTelemetryDisplay(t) {
  document.getElementById('valDist').textContent = (t.dist != null) ? t.dist : '--';

  const cardDist = document.getElementById('cardDist');
  cardDist.classList.remove('card-dist-ok', 'card-dist-mid', 'card-dist-far');
  if (t.in_place) {
    cardDist.classList.add('card-dist-ok');
  } else if (t.rev) {
    cardDist.classList.add('card-dist-far');
  } else if (t.mode === 'DOWN') {
    cardDist.classList.add('card-dist-mid');
  }

  document.getElementById('valMode').textContent = t.mode || '--';
  document.getElementById('valStatus').textContent = t.status || '--';

  const ip = document.getElementById('valInPlace');
  ip.textContent = t.in_place ? 'YES' : 'NO';
  ip.style.color = t.in_place ? 'var(--green)' : 'var(--text-dim)';

  const rv = document.getElementById('valReversing');
  rv.textContent = t.rev ? 'YES' : 'NO';
  rv.style.color = t.rev ? 'var(--orange)' : 'var(--text-dim)';
}

// ═══════════════════════════════════════════
//  Connection state
// ═══════════════════════════════════════════
function updateConnection(c) {
  stmConnected = c.connected;
  const dot = document.getElementById('statusDot');
  const headerStatus = document.getElementById('headerStatus');
  const buttons = ['btnDown', 'btnUp', 'btnStop', 'btnReset'];
  const ctrlHint = document.getElementById('ctrlHint');

  if (c.connected) {
    dot.classList.add('online');
    dot.classList.remove('offline');
    headerStatus.textContent = 'STM32 已连接';
    buttons.forEach(id => document.getElementById(id).disabled = false);
    ctrlHint.textContent = '点击按钮发送控制指令';
  } else {
    dot.classList.add('offline');
    dot.classList.remove('online');
    headerStatus.textContent = '等待 STM32 连接...';
    buttons.forEach(id => document.getElementById(id).disabled = true);
    ctrlHint.textContent = '等待 STM32 连接...';
    document.getElementById('valDist').textContent = '--';
    document.getElementById('valMode').textContent = '--';
    document.getElementById('valStatus').textContent = '--';
    document.getElementById('valInPlace').textContent = '--';
    document.getElementById('valReversing').textContent = '--';
  }
}

// ═══════════════════════════════════════════
//  Parameters
// ═══════════════════════════════════════════
function updateParamInputs(params) {
  if (params.in_place != null) document.getElementById('pInPlace').value = params.in_place;
  if (params.ground != null) document.getElementById('pGround').value = params.ground;
  if (params.full != null) document.getElementById('pFull').value = params.full;
  if (params.stuck != null) document.getElementById('pStuck').value = params.stuck;
  if (params.speed != null) document.getElementById('pSpeed').value = params.speed;
  document.getElementById('chartThIn').textContent = (params.in_place != null) ? params.in_place : '--';
  document.getElementById('chartThGnd').textContent = (params.ground != null) ? params.ground : '--';
  if (params.in_place != null) refInPlace = params.in_place;
  if (params.ground != null) refGround = params.ground;
  updateChartRefLines();
  if (distChart) distChart.update('none');
}

function setParam(prefix, inputId) {
  const input = document.getElementById(inputId);
  const val = parseInt(input.value, 10);
  if (isNaN(val)) return;
  const min = parseInt(input.min, 10);
  const max = parseInt(input.max, 10);
  if (val < min || val > max) {
    input.style.borderColor = 'var(--red)';
    setTimeout(() => { input.style.borderColor = ''; }, 1500);
    return;
  }
  sendCmd(prefix + '|' + val);

  // Flash button feedback
  const row = input.parentElement;
  const btn = row.querySelector('.param-btn');
  if (btn) {
    btn.classList.add('confirmed');
    setTimeout(() => btn.classList.remove('confirmed'), 800);
  }
}

// ═══════════════════════════════════════════
//  Command sending (POST)
// ═══════════════════════════════════════════
async function sendCmd(cmd) {
  if (!stmConnected) {
    showError('STM32 未连接，无法发送指令');
    return;
  }
  try {
    const resp = await fetch('/cmd', { method: 'POST', body: cmd });
    if (!resp.ok) {
      const text = await resp.text();
      showError(text || '发送失败');
    }
  } catch (err) {
    showError('网络错误: ' + err.message);
  }
  console.log('Sent:', cmd);
}

function showError(msg) {
  const logList = document.getElementById('logList');
  const div = document.createElement('div');
  div.className = 'log-entry log-err';
  div.innerHTML = '<span class="log-time">' + timeStr() + '</span> ' + escHtml(msg);
  if (logList.firstChild && logList.firstChild.classList.contains('log-empty')) {
    logList.innerHTML = '';
  }
  logList.insertBefore(div, logList.firstChild);
  while (logList.children.length > 500) logList.removeChild(logList.lastChild);
}

// ═══════════════════════════════════════════
//  Event log
// ═══════════════════════════════════════════
let autoScroll = true;

function addLogEntry(entry) {
  const logList = document.getElementById('logList');
  if (logList.firstChild && logList.firstChild.classList.contains('log-empty')) {
    logList.innerHTML = '';
  }

  const div = document.createElement('div');
  div.className = 'log-entry';

  const t = entry.time ? new Date(entry.time) : new Date();
  const ts = timeStr(t);
  const text = entry.text || '';

  let cls = 'log-data';
  if (text.startsWith('>>')) cls = 'log-cmd';
  else if (text.startsWith('OK|')) cls = 'log-ok';
  else if (text.startsWith('ERROR|')) cls = 'log-err';
  else if (text.startsWith('!!!')) cls = 'log-alert';
  else if (text.startsWith('***')) cls = 'log-status';
  else if (text.startsWith('PARAMS|')) cls = 'log-ok';

  div.innerHTML = '<span class="log-time">' + ts + '</span><span class="' + cls + '">' + escHtml(text) + '</span>';
  logList.insertBefore(div, logList.firstChild);

  while (logList.children.length > 500) logList.removeChild(logList.lastChild);
  if (autoScroll) logList.scrollTop = 0;
}

function toggleAutoScroll() {
  autoScroll = !autoScroll;
  document.getElementById('btnAutoScroll').classList.toggle('active', autoScroll);
}

function clearLog() {
  document.getElementById('logList').innerHTML = '<div class="log-empty">已清空</div>';
}

// ═══════════════════════════════════════════
//  Chart.js
// ═══════════════════════════════════════════
let chartData = { labels: [], distances: [], avgs: [] };
let distChart = null;
let refInPlace = 360;
let refGround = 700;

function initChart() {
  const ctx = document.getElementById('distChart').getContext('2d');
  distChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: chartData.labels,
      datasets: [
        {
          label: '距离 (mm)',
          data: chartData.distances,
          borderColor: '#00c8e8',
          backgroundColor: 'rgba(0,200,232,0.06)',
          borderWidth: 1.8,
          pointRadius: 0,
          fill: true,
          tension: 0.15,
          order: 1
        },
        {
          label: '平均',
          data: chartData.avgs,
          borderColor: 'rgba(123,157,221,0.5)',
          borderWidth: 1,
          pointRadius: 0,
          fill: false,
          tension: 0.2,
          order: 2
        },
        {
          label: '到位阈值',
          data: [],
          borderColor: 'rgba(46,213,115,0.7)',
          borderWidth: 1.2,
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false,
          order: 0
        },
        {
          label: '地面阈值',
          data: [],
          borderColor: 'rgba(255,165,2,0.55)',
          borderWidth: 1.2,
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false,
          order: 0
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 100 },
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: {
          display: true,
          position: 'top',
          labels: { color: '#6b7d93', boxWidth: 14, padding: 16, font: { size: 11 }, usePointStyle: true }
        }
      },
      scales: {
        x: {
          display: true,
          ticks: { color: '#4a5f73', maxTicksLimit: 10, font: { size: 10 } },
          grid: { color: 'rgba(30,50,70,0.4)' }
        },
        y: {
          display: true,
          title: { display: true, text: 'mm', color: '#6b7d93' },
          ticks: { color: '#4a5f73', font: { size: 10 } },
          grid: { color: 'rgba(30,50,70,0.4)' },
          beginAtZero: false
        }
      }
    }
  });
}

function updateChart() {
  if (!distChart) return;
  distChart.data.labels = chartData.labels;
  distChart.data.datasets[0].data = chartData.distances;
  distChart.data.datasets[1].data = chartData.avgs;
  updateChartRefLines();
  distChart.update('none');
}

function updateChartRefLines() {
  if (!distChart) return;
  const count = chartData.distances.length || 1;
  distChart.data.datasets[2].data = new Array(count).fill(refInPlace);
  distChart.data.datasets[3].data = new Array(count).fill(refGround);
}

// ═══════════════════════════════════════════
//  Utilities
// ═══════════════════════════════════════════
function timeStr(d) {
  if (!d) d = new Date();
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  const s = String(d.getSeconds()).padStart(2, '0');
  return h + ':' + m + ':' + s;
}

function formatTime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  if (h > 0) return h + 'h ' + String(m).padStart(2, '0') + 'm';
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function formatChartTime(ts) {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2, '0') + ':' +
         String(d.getMinutes()).padStart(2, '0') + ':' +
         String(d.getSeconds()).padStart(2, '0');
}

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// ═══════════════════════════════════════════
//  Uptime ticker
// ═══════════════════════════════════════════
let startTime = Date.now();
setInterval(() => {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById('uptime').textContent = formatTime(elapsed);
}, 10000);

// ═══════════════════════════════════════════
//  Init
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  initChart();
  ['pInPlace', 'pGround'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      const el = document.getElementById('pInPlace');
      const v = parseInt(el.value, 10);
      if (!isNaN(v)) { refInPlace = v; document.getElementById('chartThIn').textContent = v; }
      const elg = document.getElementById('pGround');
      const vg = parseInt(elg.value, 10);
      if (!isNaN(vg)) { refGround = vg; document.getElementById('chartThGnd').textContent = vg; }
      updateChartRefLines();
      if (distChart) distChart.update('none');
    });
  });
});
</script>
